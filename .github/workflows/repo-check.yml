name: repo check

# The repo checks itself on every push. The point is not the green tick;
# the point is that the tick cannot be green without having run.
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # FULL HISTORY is required: C3 scans every blob reachable from every
          # ref, and a shallow clone would make it scan almost nothing. C3
          # refuses to report PASS on a walk that inspected almost nothing, so
          # a shallow checkout would show up as WARN, not as a false green --
          # but there is no reason to pay that: fetch it all.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # C7 IMPORTS every module, and agent/agent-daemon.py imports
      # claude_agent_sdk at module level. Without this step C7 fails on every
      # run, on every commit, forever -- which is exactly what happened: 138
      # runs, 138 red, on a tree that passes locally. The local pass was an
      # artefact of the SDK being installed on the dev box.
      #
      # This is the ONE dependency C7 needs. Installing the full Docker image's
      # requirements would be wrong here: it would let C7 pass on modules that
      # only import because of packages the agent image does not ship.
      - name: the SDK the daemon imports (C7 imports the daemon)
        run: python3 -m pip install --disable-pip-version-check "claude-agent-sdk>=0.2.0"

      - name: the checks can fail (negative controls)
        run: python3 tools/repo_check.py --selftest

      - name: the repo passes its own checks
        run: python3 tools/repo_check.py .

      # THE SUITES, AND THE COUNT. agent-6 measured that this workflow ran
      # NONE of the 15 suites tools/check.py discovers: severing
      # wake_prompt = read_wake_prompt() left both steps green. Adding the
      # step alone is not enough -- check.py exits 0 on WARN as well as PASS
      # ("CHECK: WARN (16 pass, 1 warn, 0 fail)", exit 0, measured here), so a
      # step wired to the EXIT CODE cannot tell a run that found 16 suites
      # from one that found none, which is the same defect one level up.
      # Assert the DISCOVERED COUNT that check.py prints instead.
      - name: the suites run, and the count is asserted
        run: |
          # set -e is NOT decoration. pipefail makes the PIPELINE's status
          # nonzero, but a step's exit status is its LAST command's -- the
          # trailing `test` below succeeds, so without -e the step exits 0
          # even when check.py printed FAIL. Measured both ways:
          #   pipefail + trailing test, failing runner -> STEP EXIT 0
          #   set -e   + trailing test, failing runner -> STEP EXIT 1
          # agent-6 found this; it is the same defect the step exists to fix.
          set -e
          set -o pipefail
          python3 tools/check.py | tee /tmp/check.log
          n=$(grep -oE 'check: [0-9]+ suite' /tmp/check.log | grep -oE '[0-9]+' | head -1)
          test -n "$n" || { echo "::error::check.py printed no suite count"; exit 1; }
          test "$n" -ge 15 || { echo "::error::check.py discovered only $n suites"; exit 1; }
